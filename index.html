<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CommBadge">
  <meta name="description" content="IPM's CommBadge — two-way video call">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>IPM's CommBadge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #181b24; --surface2: #1f2330;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0; --muted: #7a7f8e;
      --accent: #a8f0c6; --accent-dim: rgba(168,240,198,0.12); --accent-border: rgba(168,240,198,0.3);
      --danger: #f0a8a8; --danger-dim: rgba(240,168,168,0.12); --danger-border: rgba(240,168,168,0.3);
      --warn: #f0d8a8; --warn-dim: rgba(240,216,168,0.12); --warn-border: rgba(240,216,168,0.3);
      --blue: #a8d8f0; --blue-dim: rgba(168,216,240,0.12); --blue-border: rgba(168,216,240,0.3);
      --green: #4cdb7a; --green-dim: rgba(76,219,122,0.12); --green-border: rgba(76,219,122,0.35);
      --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
      --r: 12px; --r-sm: 8px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    body.embed-mode { background: transparent; min-height: 0; padding: 0; }
    body.embed-mode main { padding: 0; max-width: none; }
    body.embed-mode .embed-hide { display: none !important; }

    main { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.875rem; max-width: 480px; margin: 0 auto; width: 100%; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem; }
    .section-label { font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.6rem; }

    /* Status bar */
    .status-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0.6rem 1rem; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .stream-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
    .stream-dot.live       { background: var(--danger); box-shadow: 0 0 6px rgba(240,100,100,0.6); animation: pulse 1.5s infinite; }
    .stream-dot.watching   { background: var(--accent); }
    .stream-dot.connecting { background: var(--warn); }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

    /* Call buttons */
    .call-btn { width: 100%; padding: 15px; border-radius: var(--r-sm); font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.15s, transform 0.1s; border: 1px solid; min-height: 48px; }
    .call-btn:active { transform: scale(0.99); }
    .call-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .call-btn.green  { background: var(--green-dim);  border-color: var(--green-border);  color: var(--green); }
    .call-btn.green:hover:not(:disabled)  { background: rgba(76,219,122,0.22); }
    .call-btn.blue   { background: var(--blue-dim);   border-color: var(--blue-border);   color: var(--blue); }
    .call-btn.blue:hover:not(:disabled)   { background: rgba(168,216,240,0.2); }
    .call-btn.danger { background: var(--danger-dim); border-color: var(--danger-border); color: var(--danger); }
    .call-btn.danger:hover:not(:disabled) { background: rgba(240,100,100,0.22); }
    .call-btn.ctrl   { background: var(--surface2);   border-color: var(--border2);       color: var(--muted); }
    .call-btn.ctrl:hover:not(:disabled)   { color: var(--text); }
    .call-btn.warn   { background: var(--warn-dim);   border-color: var(--warn-border);   color: var(--warn); }
    /* Video */
    .call-video-wrap { position: relative; background: #000; border-radius: var(--r-sm); overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--border); }
    .call-video-wrap video#remote-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .call-video-wrap video#local-video  { position: absolute; bottom: 8px; right: 8px; width: 26%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2); background: #111; z-index: 2; }
    .call-video-wrap .no-stream { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; padding: 1rem; }
    .video-controls-tr { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; gap: 8px; }
    .video-icon-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background 0.15s, transform 0.1s; }
    .video-icon-btn:hover { background: rgba(0,0,0,0.7); }
    .video-icon-btn:active { transform: scale(0.92); }
    .video-icon-btn svg { width: 18px; height: 18px; }
    .video-icon-btn:disabled { opacity: 0.3; cursor: default; }
    .video-icon-btn.active { background: var(--warn); border-color: var(--warn); color: #2a2210; }



    /* Toast */
    .toast { position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); border: 1px solid var(--border2); border-radius: 999px; padding: 9px 20px; font-family: var(--mono); font-size: 12px; color: var(--text); opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 400; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<main>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="stream-dot" id="stream-dot"></span>
    <span id="stream-status-text" style="font-family:var(--mono);font-size:12px">Ready</span>
  </div>

  <!-- Connect button (shown when not in a call) -->
  <div id="card-action">
    <button class="call-btn green" id="btn-connect" onclick="connect()">&#9679; Connect</button>
    <div class="embed-hide" id="version-text" style="text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:0.75rem">IPM's CommBadge v2.0.5</div>
  </div>

  <!-- Video -->
  <div id="card-video" style="display:none">
    <div class="call-video-wrap">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video"  autoplay muted playsinline></video>
      <div class="no-stream" id="no-stream-msg">Waiting for other user…</div>
      <div class="video-controls-tr">
        <button class="video-icon-btn" id="btn-mute" onclick="toggleMute()" aria-label="Mute microphone" title="Mute microphone">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 17v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line id="mic-slash" x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
          </svg>
        </button>
        <button class="video-icon-btn" id="btn-cam" onclick="toggleCamera()" aria-label="Hide camera" title="Hide camera">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5H14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 14 18H4.5A1.5 1.5 0 0 1 3 16.5v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M15.5 10.3 20 7.8v8.4l-4.5-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line id="cam-slash" x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
          </svg>
        </button>
        <button class="video-icon-btn" id="btn-flip" onclick="flipCamera()" aria-label="Switch camera" title="Switch camera">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 2.5 20.5 6 17 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.5 6H8a5.5 5.5 0 0 0-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 21.5 3.5 18 7 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 18H16a5.5 5.5 0 0 0 5.5-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="dbg" style="display:none;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);padding:0.4rem 0.5rem;word-break:break-word"></div>

  <!-- End call -->
  <div id="card-controls" style="display:none">
    <div class="card">
      <button class="call-btn danger" onclick="endCall()">&#9632; End Call</button>
    </div>
  </div>

</main>
<div class="toast" id="toast"></div>
<script>
// ── Config ────────────────────────────────────────────────────
// Signalling uses a Supabase Realtime channel (broadcast + presence); no tables needed.
const SB_URL    = 'https://bwazurshtrpqzatmkdkj.supabase.co';
const SB_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3YXp1cnNodHJwcXphdG1rZGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MjMwMTMsImV4cCI6MjA5NTQ5OTAxM30.GLp4TEQ8geyczhNXzH8ZX3QcnAq32GntTgitXWcagdY';
const ROOM      = 'commbadge-room';

// Relay (TURN) server. Needed when the two devices can't reach each other directly
// (cellular data, strict routers). Free account at metered.ca → Dashboard → TURN Server →
// Credentials → Create Credential, then paste your app name and that credential's apiKey.
// Use the credential's apiKey only (safe for front-end use), never the account Secret Key.
const TURN_APP     = 'mmx';   // your Metered app name, e.g. 'myapp' (from https://myapp.metered.live)
const TURN_API_KEY = 'b40cc7d133741a6b200d6d8316fff75090cf';   // the credential's apiKey
const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];

// Test mode: open the page with ?relay=1 on BOTH devices to force every call through the relay server.
const RELAY_ONLY = new URLSearchParams(window.location.search).get('relay') === '1';

// ── State ─────────────────────────────────────────────────────
let supabaseClient = null, channel = null, pc = null, localStream = null;
let iceServers = STUN_SERVERS, peerId = null, pendingCandidates = [];
let active = false, isMuted = false, isCamHidden = false, cameraFacing = 'rear';
const dbg = { relay: 'not loaded', h: 0, s: 0, r: 0, err: '', ice: '-', conn: '-', rx: 0, rxErr: '', role: '', pairs: '' };
function renderDbg() {
  const d = getEl('dbg'); if (!d) return;
  d.style.display = active ? 'block' : 'none';
  d.textContent = 'relay: ' + dbg.relay + ' | candidates host ' + dbg.h + ' stun ' + dbg.s + ' relay ' + dbg.r + ' | remote cand ' + dbg.rx + (dbg.rxErr ? ' (' + dbg.rxErr + ')' : '') + ' | ' + dbg.role + ' | ice ' + dbg.ice + (dbg.pairs ? ' | ' + dbg.pairs : '') + ' | conn ' + dbg.conn + (dbg.err ? ' | ' + dbg.err : '');
}
let statsTimer = null;
async function pollStats(mine) {
  try {
    const rep = await mine.getStats(); const pair = {}, rem = {}, lt = {}, rt = {}, live = []; let n = 0;
    rep.forEach(r => {
      if (r.type === 'local-candidate') lt[r.id] = r.candidateType;
      if (r.type === 'remote-candidate') { rt[r.id] = r.candidateType; rem[r.candidateType] = (rem[r.candidateType] || 0) + 1; }
    });
    rep.forEach(r => {
      if (r.type !== 'candidate-pair') return;
      n++; pair[r.state] = (pair[r.state] || 0) + 1;
      if (r.state !== 'failed' && r.state !== 'frozen' && live.length < 6)
        live.push((lt[r.localCandidateId] || '?') + '>' + (rt[r.remoteCandidateId] || '?') + ':' + r.state + (r.nominated ? '*' : ''));
    });
    dbg.pairs = 'pairs ' + n + ' ' + JSON.stringify(pair) + ' remote ' + JSON.stringify(rem) + ' live [' + live.join(', ') + ']';
    renderDbg();
  } catch (e) {}
}
let watchdog = null, lostTimer = null, retryTimer = null, hiddenTimer = null, wakeLock = null;

// Stable id for this tab (survives reloads) so a reload isn't mistaken for a second person.
const myId = (() => {
  const fresh = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
  try { let v = sessionStorage.getItem('cb_peer_id'); if (!v) { v = fresh(); sessionStorage.setItem('cb_peer_id', v); } return v; }
  catch (e) { return fresh(); }
})();

// ── Helpers ───────────────────────────────────────────────────
const getEl = id => document.getElementById(id);

function showToast(msg) {
  const t = getEl('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(state, msg) {
  getEl('stream-dot').className = 'stream-dot' + (state === 'live' ? ' live' : state === 'connecting' ? ' connecting' : '');
  getEl('stream-status-text').textContent = msg;
}

function showIdle() {
  getEl('card-action').style.display = 'block';
  getEl('card-video').style.display = 'none';
  getEl('card-controls').style.display = 'none';
}
function showCall() {
  getEl('card-action').style.display = 'none';
  getEl('card-video').style.display = 'block';
  getEl('card-controls').style.display = 'block';
}

// ── Camera & mic ──────────────────────────────────────────────
// Ask for camera + mic. If one is missing or busy, carry on with whatever works; if neither
// works, still connect so you can see and hear the other person. Only a blocked permission stops it.
async function getLocalStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error('unsupported'); e.name = 'Unsupported'; throw e;
  }
  const video = { facingMode: { ideal: cameraFacing === 'rear' ? 'environment' : 'user' } };
  const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  const attempts = [
    { constraints: { video, audio }, note: '' },
    { constraints: { video: false, audio }, note: 'No camera available — audio only' },
    { constraints: { video, audio: false }, note: 'No microphone available — video only' }
  ];
  for (const a of attempts) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(a.constraints);
      if (a.note) showToast(a.note);
      return stream;
    } catch (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) throw err;
    }
  }
  showToast('No camera or mic available — you can still see and hear the other person');
  return new MediaStream();
}

function describeMediaError(err) {
  const n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera/mic blocked — allow access in the browser address bar';
  if (n === 'Unsupported') return 'This browser cannot use the camera here (needs https)';
  return 'Could not start camera/mic' + (n ? ' (' + n + ')' : '');
}

// Grey out controls that don't apply to what we actually have
function syncControls() {
  const hasA = !!(localStream && localStream.getAudioTracks().length);
  const hasV = !!(localStream && localStream.getVideoTracks().length);
  getEl('btn-mute').disabled = !hasA;
  getEl('btn-cam').disabled = !hasV;
  getEl('btn-flip').disabled = !hasV;
  getEl('local-video').style.display = hasV ? '' : 'none';
}

// Flip camera mid-call by replacing the video track
async function flipCamera() {
  if (!localStream || !localStream.getVideoTracks().length) return;
  const next = cameraFacing === 'rear' ? 'front' : 'rear';
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: next === 'rear' ? 'environment' : 'user' }, audio: false
    });
    const newTrack = newStream.getVideoTracks()[0];
    if (pc) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) await sender.replaceTrack(newTrack);
    }
    const oldTrack = localStream.getVideoTracks()[0];
    if (oldTrack) { oldTrack.stop(); localStream.removeTrack(oldTrack); }
    localStream.addTrack(newTrack);
    newTrack.enabled = !isCamHidden;
    cameraFacing = next;
    getEl('local-video').srcObject = localStream;
  } catch (err) { showToast('Could not flip camera'); }
}

function toggleMute() {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0]; if (!track) return;
  isMuted = !isMuted; track.enabled = !isMuted;
  const btn = getEl('btn-mute');
  btn.classList.toggle('active', isMuted);
  btn.title = isMuted ? 'Unmute microphone' : 'Mute microphone';
  getEl('mic-slash').style.display = isMuted ? '' : 'none';
}

function toggleCamera() {
  if (!localStream) return;
  const track = localStream.getVideoTracks()[0]; if (!track) return;
  isCamHidden = !isCamHidden; track.enabled = !isCamHidden;
  const btn = getEl('btn-cam');
  btn.classList.toggle('active', isCamHidden);
  btn.title = isCamHidden ? 'Show camera' : 'Hide camera';
  getEl('cam-slash').style.display = isCamHidden ? '' : 'none';
  getEl('local-video').style.opacity = isCamHidden ? '0.15' : '1';
}

// Keep the default audio output (stops some browsers grabbing a headset)
async function restoreAudioOutput() {
  try { const rv = getEl('remote-video'); if (rv && rv.setSinkId) await rv.setSinkId('default'); } catch (err) {}
}

// Keep the screen awake during a call
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
async function releaseWakeLock() {
  if (!wakeLock) return;
  try { await wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

// ── Relay servers ─────────────────────────────────────────────
async function loadIceServers() {
  if (!TURN_APP || !TURN_API_KEY) { dbg.relay = 'not configured'; return STUN_SERVERS; }   // no relay configured: direct connections only
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000);
    const res = await fetch(`https://${TURN_APP}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(TURN_API_KEY)}`, { signal: ctl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    if (Array.isArray(list) && list.length) { dbg.relay = 'ok (' + list.length + ' servers)'; return list; }
    dbg.relay = 'empty reply'; return STUN_SERVERS;
  } catch (err) { console.warn('Relay lookup failed, using direct connection only:', err); dbg.relay = 'LOOKUP FAILED (' + (err && err.message || err) + ')'; return STUN_SERVERS; }
}

// ── Connecting two people ─────────────────────────────────────
// Both people join the same Realtime room. The one with the smaller id places the call (so the
// two never "offer" at once); the other answers. Messages carry from/to so a third device
// joining the room can't interfere.
function initSB() { if (!supabaseClient) supabaseClient = window.supabase.createClient(SB_URL, SB_KEY); }

async function connect() {
  if (active) return;
  active = true;
  getEl('btn-connect').disabled = true;
  setStatus('connecting', 'Starting camera…');
  try { localStream = await getLocalStream(); }
  catch (err) { active = false; getEl('btn-connect').disabled = false; setStatus('', 'Ready'); showToast(describeMediaError(err)); return; }
  const lv = getEl('local-video'); lv.srcObject = localStream; lv.play().catch(() => {});
  syncControls(); showCall(); requestWakeLock();
  setStatus('connecting', 'Waiting for the other person…');
  iceServers = await loadIceServers();
  renderDbg();
  if (!active) return;                                        // ended while loading
  initSB();
  channel = supabaseClient.channel(ROOM, { config: { broadcast: { self: false }, presence: { key: myId } } });
  channel.on('broadcast', { event: 'signal' }, ({ payload }) => onSignal(payload));
  channel.on('presence', { event: 'sync' }, onPresence);
  channel.subscribe(async status => {
    if (!active) return;
    if (status === 'SUBSCRIBED') { try { await channel.track({ t: Date.now() }); } catch (e) {} }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') cleanup('Could not reach the call service');
  });
}

function send(msg) {
  if (!channel || !peerId) return;
  try { Promise.resolve(channel.send({ type: 'broadcast', event: 'signal', payload: { from: myId, to: peerId, ...msg } })).catch(() => {}); } catch (e) {}
}

const iAmCaller = () => !!peerId && myId < peerId;

function onPresence() {
  if (!active || !channel) return;
  const state = channel.presenceState();
  const others = Object.keys(state).filter(k => k !== myId);
  if (!others.length) { peerId = null; closePC(); setStatus('connecting', 'Waiting for the other person…'); return; }
  if (!(peerId && others.includes(peerId))) {                 // keep the current partner while they're present
    const newest = k => Math.max(0, ...(state[k] || []).map(p => p.t || 0));
    others.sort((a, b) => newest(b) - newest(a));
    peerId = others[0]; closePC();
  }
  if (!pc) { setStatus('connecting', 'Connecting…'); if (iAmCaller()) startAsCaller(); }
}

function makePC() {
  closePC();
  const mine = new RTCPeerConnection({ iceServers, iceTransportPolicy: RELAY_ONLY ? 'relay' : 'all' });
  pc = mine; pendingCandidates = [];
  dbg.h = dbg.s = dbg.r = 0; dbg.rx = 0; dbg.rxErr = ''; dbg.role = (iAmCaller() ? 'caller' : 'answerer') + (RELAY_ONLY ? ' RELAY-ONLY' : ''); dbg.err = ''; dbg.ice = 'new'; dbg.conn = 'new'; renderDbg();
  localStream.getTracks().forEach(t => mine.addTrack(t, localStream));
  // Anything we can't send, we can still receive
  ['audio', 'video'].forEach(kind => {
    if (!localStream.getTracks().some(t => t.kind === kind)) mine.addTransceiver(kind, { direction: 'recvonly' });
  });
  mine.onicecandidate = ({ candidate }) => {
    if (!candidate || pc !== mine) return;
    const t = (candidate.candidate.match(/ typ (\w+)/) || [])[1];
    if (t === 'relay') dbg.r++; else if (t === 'srflx') dbg.s++; else dbg.h++;
    renderDbg();
    send({ kind: 'candidate', candidate });
  };
  mine.onicecandidateerror = (e) => { if (pc === mine) { dbg.err = 'ice error ' + e.errorCode + (e.url ? ' ' + String(e.url).split('?')[0] : '') + (e.errorText ? ' ' + e.errorText : ''); renderDbg(); } };
  mine.oniceconnectionstatechange = () => { if (pc === mine) { dbg.ice = mine.iceConnectionState; renderDbg(); } };
  mine.ontrack = ({ streams, track }) => {
    if (pc !== mine) return;
    const rv = getEl('remote-video');
    rv.srcObject = streams[0] || new MediaStream([track]);
    getEl('no-stream-msg').style.display = 'none';
    rv.play().catch(() => {});
    restoreAudioOutput();
  };
  mine.onconnectionstatechange = () => {
    if (pc !== mine) return;
    const s = mine.connectionState; dbg.conn = s; renderDbg();
    if (s === 'connected') {
      clearTimeout(watchdog); clearTimeout(lostTimer); clearTimeout(retryTimer);
      setStatus('live', 'Connected'); getEl('no-stream-msg').style.display = 'none';
    } else if (s === 'disconnected') {
      setStatus('connecting', 'Reconnecting…');
      clearTimeout(lostTimer);
      lostTimer = setTimeout(() => { if (pc === mine && mine.connectionState !== 'connected') recover(); }, 8000);
    } else if (s === 'failed') recover();
  };
  clearInterval(statsTimer); statsTimer = setInterval(() => { if (pc === mine) pollStats(mine); }, 2000);
  watchdog = setTimeout(() => { if (pc === mine && mine.connectionState !== 'connected') recover(); }, 20000);
}

function closePC() {
  clearTimeout(watchdog); clearTimeout(lostTimer); clearTimeout(retryTimer); clearInterval(statsTimer);
  const old = pc; pc = null; pendingCandidates = [];
  if (old) { old.onicecandidate = old.onicecandidateerror = old.oniceconnectionstatechange = old.ontrack = old.onconnectionstatechange = null; try { old.close(); } catch (e) {} }
  getEl('remote-video').srcObject = null;
  getEl('no-stream-msg').style.display = 'flex';
}

async function startAsCaller() {
  makePC();
  try {
    await pc.setLocalDescription(await pc.createOffer());
    send({ kind: 'offer', sdp: pc.localDescription });
  } catch (err) { console.warn('offer failed', err); }
}

// Start over with the same partner (caller re-offers; answerer asks the caller to)
function recover() {
  if (!active || !peerId) return;
  setStatus('connecting', 'Reconnecting…');
  closePC();
  if (iAmCaller()) {
    retryTimer = setTimeout(() => { if (active && peerId && !pc && iAmCaller()) startAsCaller(); }, 1500);
  } else {
    send({ kind: 'need-offer' });
    retryTimer = setTimeout(() => { if (active && peerId && (!pc || pc.connectionState !== 'connected')) recover(); }, 8000);
  }
}

async function flushCandidates() {
  const list = pendingCandidates; pendingCandidates = [];
  for (const c of list) { try { await pc.addIceCandidate(c); } catch (e) { dbg.rxErr = 'add failed: ' + (e && e.name); renderDbg(); } }
}

async function onSignal(m) {
  if (!active || !m || m.from === myId || m.to !== myId) return;
  const present = channel ? Object.keys(channel.presenceState()) : [];
  if (m.kind === 'bye') { if (m.from === peerId) { showToast('Call ended'); cleanup('Call ended'); } return; }
  if (m.kind === 'offer') {
    if (peerId && m.from !== peerId && present.includes(peerId)) return;   // already talking to someone else
    peerId = m.from;
    makePC();
    const mine = pc;
    try {
      await mine.setRemoteDescription(m.sdp);
      await flushCandidates();
      await mine.setLocalDescription(await mine.createAnswer());
      if (pc === mine) send({ kind: 'answer', sdp: mine.localDescription });
    } catch (err) { console.warn('answer failed', err); }
    return;
  }
  if (m.from !== peerId) return;
  if (m.kind === 'answer') {
    if (pc && pc.signalingState === 'have-local-offer') {
      try { await pc.setRemoteDescription(m.sdp); await flushCandidates(); } catch (err) { console.warn('answer rejected', err); }
    }
  } else if (m.kind === 'candidate') {
    if (!pc) return;
    dbg.rx++; renderDbg();
    if (pc.remoteDescription) { try { await pc.addIceCandidate(m.candidate); } catch (e) { dbg.rxErr = 'add failed: ' + (e && e.name); renderDbg(); } }
    else pendingCandidates.push(m.candidate);
  } else if (m.kind === 'need-offer') {
    if (iAmCaller()) { closePC(); startAsCaller(); }
  }
}

async function endCall() {
  if (channel && peerId) {
    try { await channel.send({ type: 'broadcast', event: 'signal', payload: { from: myId, to: peerId, kind: 'bye' } }); } catch (e) {}
  }
  cleanup('Call ended');
}

function cleanup(msg) {
  active = false; peerId = null;
  closePC();
  const ch = channel; channel = null;
  if (ch) { try { ch.unsubscribe(); } catch (e) {} }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  releaseWakeLock();
  clearTimeout(hiddenTimer); hiddenTimer = null;
  isMuted = false; isCamHidden = false;
  const lv = getEl('local-video'); lv.srcObject = null; lv.style.opacity = '1';
  const bm = getEl('btn-mute'), bc = getEl('btn-cam');
  bm.classList.remove('active'); bm.title = 'Mute microphone';
  bc.classList.remove('active'); bc.title = 'Hide camera';
  getEl('mic-slash').style.display = 'none'; getEl('cam-slash').style.display = 'none';
  getEl('btn-connect').disabled = false;
  ['btn-mute', 'btn-cam', 'btn-flip'].forEach(id => { getEl(id).disabled = false; });
  lv.style.display = '';
  showIdle(); renderDbg(); setStatus('', msg || 'Ready');
}

// ── Page lifecycle ────────────────────────────────────────────
// Safety net: if the page is hidden for 10 minutes mid-call, end it rather than leave the camera running.
document.addEventListener('visibilitychange', () => {
  if (!active) return;
  if (document.visibilityState === 'hidden') {
    hiddenTimer = setTimeout(() => { if (active) endCall(); }, 10 * 60 * 1000);
  } else {
    clearTimeout(hiddenTimer); hiddenTimer = null;
    getEl('local-video').play().catch(() => {});
    getEl('remote-video').play().catch(() => {});
    if (!wakeLock) requestWakeLock();
    if (pc && (pc.connectionState === 'disconnected' || pc.connectionState === 'failed')) recover();
  }
});
// If remote video was blocked from auto-playing, the next tap anywhere starts it.
document.addEventListener('click', () => { const rv = getEl('remote-video'); if (rv.srcObject && rv.paused) rv.play().catch(() => {}); });
// Leave the room promptly when the page closes so the other person isn't left with a ghost.
window.addEventListener('pagehide', () => { if (channel) { try { channel.unsubscribe(); } catch (e) {} } });

// ── Embed mode (for hosting inside an iframe, e.g. MMX) ───────
const EMBED_MODE = new URLSearchParams(window.location.search).get('embed') === '1';
if (EMBED_MODE) document.body.classList.add('embed-mode');

// Accept small settings from a parent frame.
// Parent sends: { source:'commbadge-host', type:'settings', selectedCamera:'front'|'rear' } or { ..., type:'end-call' }
window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || data.source !== 'commbadge-host') return;
  if (data.type === 'settings' && data.selectedCamera) {
    try { localStorage.setItem('cb_camera', data.selectedCamera); } catch (err) {}
  }
  if (data.type === 'end-call' && active) endCall();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
